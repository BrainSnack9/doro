name: Test & deploy Haru link hub to GitHub Pages

# push 하나로 PR 체크까지 충당한다 (pull_request를 함께 걸면 같은 커밋에 두 실행이 떠서
# 서로 취소돼 실패로 표시됨). 동시 실행 제한은 배포 잡에만 둔다.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m unittest discover -s haru/tests -t haru

  deploy:
    # github-pages 환경은 기본 브랜치에서만 배포를 허용한다. PR 브랜치에서는 테스트만 돈다.
    if: github.ref == 'refs/heads/ccr-f12c0d22-7a4l0e' || github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build link hub
        run: |
          python3 haru/hub/build_hub.py
          mkdir -p dist
          cp haru/hub/dist/index.html dist/index.html
          echo harureviews.date > dist/CNAME
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
