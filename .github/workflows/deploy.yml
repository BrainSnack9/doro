name: Test & deploy to GitHub Pages

on:
  push:
    branches: [main, ccr-f12c0d22-7a4l0e]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages (creates the site on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build static bundle
        run: |
          mkdir -p dist
          cp -r index.html sw.js manifest.webmanifest css js icons dist/
          mkdir -p dist/haru && python3 haru/hub/build_hub.py && cp haru/hub/dist/index.html dist/haru/index.html
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
