<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{{TITLE}} · 하루 운영</title>
<style>
  :root { --paper:#f6f7f4; --paper-deep:#e9ece4; --ink:#1c2430; --ink-soft:#5b6570; --rule:#d5d9cf; --marker:#f6e75a; --ok:#2e7d4f; --no:#9aa39b; --err:#b4332a; --warn:#fff3c4; }
  @media (prefers-color-scheme: dark) { :root { --paper:#171a18; --paper-deep:#22262300; --ink:#e8eae4; --ink-soft:#a3a99e; --rule:#343a35; --marker:#d9c93a; --ok:#6fbf8f; --no:#6b736c; --err:#e07a72; --warn:#3a3410; } :root { --paper-deep:#1f2320; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:"Pretendard","IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,sans-serif; font-size:15px; line-height:1.55; }
  header { border-bottom:1px solid var(--rule); background:var(--paper); position:sticky; top:0; z-index:2; }
  .bar { max-width:1100px; margin:0 auto; padding:10px 20px; display:flex; align-items:center; gap:18px; }
  .bar h1 { font-size:16px; margin:0; } .bar nav { display:flex; gap:4px; } .bar nav a { text-decoration:none; padding:6px 12px; border-radius:999px; font-size:14px; } .bar nav a.on { background:var(--ink); color:var(--paper); } .bar .gen { margin-left:auto; font-size:12px; color:var(--ink-soft); }
  main { max-width:1100px; margin:0 auto; padding:18px 20px 60px; }
  h2 { font-size:16px; margin:26px 0 10px; } h3 { font-size:13.5px; margin:0 0 6px; color:var(--ink-soft); }
  .kpis { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:10px; margin-top:6px; }
  .kpi { background:var(--paper-deep); border-radius:10px; padding:12px 14px; } .kpi b { display:block; font-size:24px; } .kpi span { font-size:12.5px; color:var(--ink-soft); } .kpi.bad b { color:var(--err); }
  table { width:100%; border-collapse:collapse; font-size:14px; } th, td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--rule); vertical-align:top; } th { font-size:12.5px; color:var(--ink-soft); font-weight:600; }
  .pname { display:flex; gap:10px; min-width:240px; } .thumb { width:52px; height:52px; object-fit:cover; border-radius:8px; flex:none; background:var(--paper-deep); }
  .sub { font-size:12.5px; color:var(--ink-soft); } .hook { color:var(--ink); } .no { color:var(--no); } .err { color:var(--err); } .ok-text { color:var(--ok); }
  .badge { display:inline-block; font-size:11.5px; border-radius:999px; padding:1px 8px; border:1px solid var(--rule); } .badge.ok { background:var(--ok); color:#fff; border-color:var(--ok); } .badge.no { color:var(--no); }
  .cards { display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:12px; } .card { background:var(--paper-deep); border-radius:12px; padding:14px 16px; } .card.warn { background:var(--warn); } .big { font-size:22px; font-weight:600; margin:2px 0 6px; } .big .sub { font-weight:400; font-size:12.5px; }
  pre.small { font-size:11.5px; white-space:pre-wrap; color:var(--ink-soft); max-height:160px; overflow:auto; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; } figure { margin:0; } figure img { width:100%; aspect-ratio:3/4; object-fit:cover; border-radius:10px; background:var(--paper-deep); } figcaption { font-size:12.5px; margin-top:4px; word-break:break-all; }
  ul.alerts { margin:0; padding-left:18px; } ul.alerts li { margin:3px 0; } ul.errs { margin:0; padding-left:18px; color:var(--err); font-size:13px; }
  .sys { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:8px 20px; font-size:14px; } .sys div b { display:inline-block; min-width:92px; color:var(--ink-soft); font-weight:600; }
  a { color:inherit; }
</style>
</head>
<body>
<header><div class="bar"><h1>하루 운영</h1><nav>{{NAV}}</nav><span class="gen">수집 {{GENERATED_AT}}</span></div></header>
<main>
{{BODY}}
</main>
</body>
</html>
