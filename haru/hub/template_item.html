<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, nofollow">
<meta name="description" content="{{DESCRIPTION}}">
<title>{{TITLE}} · {{SITE_NAME}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#eef0ea; --paper-deep:#e3e6dd; --ink:#1c2430; --ink-soft:#55606c; --rule:#cfd4c9; --marker:#f6e75a; --marker-ink:#1c2430; --link:#1f4d7a; }
  @media (prefers-color-scheme: dark) { :root { --paper:#171a18; --paper-deep:#1f2320; --ink:#e8eae4; --ink-soft:#a3a99e; --rule:#343a35; --marker:#d9c93a; --marker-ink:#171a18; --link:#9cc3ea; } }
  * { box-sizing:border-box; }
  html { background:var(--paper); }
  body { margin:0; color:var(--ink); background:var(--paper); font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  main { max-width:560px; margin:0 auto; padding:20px 16px 64px; }
  a { color:inherit; }
  .disclosure { font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 16px; }
  .disclosure p { margin:0; }
  .back { display:inline-block; font-size:14px; color:var(--ink-soft); text-decoration:none; margin-bottom:14px; }
  .back:hover { color:var(--ink); }
  .detail-img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:12px; display:block; background:var(--paper-deep); }
  .empty-thumb { display:grid; place-items:center; color:var(--ink-soft); font-size:12px; }
  .kicker { margin:14px 0 4px; font-size:13px; color:var(--ink-soft); }
  .badge { display:inline-block; border:1px solid var(--rule); border-radius:999px; padding:0 7px; font-size:11px; margin-right:4px; }
  h1 { font-size:22px; line-height:1.35; font-weight:600; margin:0 0 8px; }
  h1 span { background:linear-gradient(transparent 55%, var(--marker) 55%, var(--marker) 92%, transparent 92%); padding:0 2px; }
  @media (prefers-color-scheme: dark) { h1 span { background:linear-gradient(transparent 60%, rgba(217,201,58,.42) 60%, rgba(217,201,58,.42) 92%, transparent 92%); } }
  .price { margin:0 0 14px; font-size:17px; font-weight:600; }
  .price s { color:var(--ink-soft); font-weight:400; margin-left:6px; }
  .reason { font-family:"Gowun Batang",serif; font-size:17px; line-height:1.6; margin:0 0 18px; padding-left:12px; border-left:3px solid var(--marker); }
  .block { border-top:1px solid var(--rule); padding:12px 0; }
  .block h3 { margin:0 0 4px; font-size:13px; font-weight:600; color:var(--ink-soft); }
  .block p { margin:0; font-size:15px; }
  .block.con h3 { color:var(--ink); }
  .go { display:block; margin:18px 0 8px; text-align:center; font-size:16px; font-weight:600; color:var(--marker-ink); background:var(--marker); border-radius:10px; padding:14px; text-decoration:none; }
  .go:hover { filter:brightness(.96); }
  .go:focus-visible { outline:2px solid var(--link); outline-offset:3px; }
  .note { font-size:13px; color:var(--ink-soft); margin:0; }
  footer { margin-top:36px; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  footer p { margin:0 0 4px; }
</style>
{{ANALYTICS}}
</head>
<body>
<main>
  <div class="disclosure">
    <p>{{AI_LABEL}}</p>
    <p>{{AFFILIATE_LABEL}}</p>
  </div>
  <a class="back" href="../">← 하루의 오늘 추천</a>

  {{IMAGE}}
  <p class="kicker"><span class="badge">{{PROGRAM}}</span><span class="badge">{{CATEGORY}}</span> {{DATE}}</p>
  <h1><span>{{NAME}}</span></h1>
  {{PRICE}}
  <p class="reason">{{REASON}}</p>

  {{FACT}}
  {{CON}}

  <a class="go" href="{{GO}}" rel="nofollow sponsored noopener" target="_blank">{{PROGRAM}}에서 보기</a>
  <p class="note">하루는 AI라 직접 써본 적이 없어요. 위 내용은 리뷰를 읽고 정리한 것입니다. 가격은 판매처 기준.</p>

  <footer>
    <p>마지막 갱신 {{GENERATED_AT}} (KST) · <a href="{{THREADS}}">스레드에서 하루 보기</a></p>
{{PROGRAM_NOTES}}
  </footer>
</main>
</body>
</html>
