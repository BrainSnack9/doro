<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, nofollow">
<meta name="description" content="AI 가상인물 하루가 리뷰를 읽고 고른 추천. 써본 척 안 하고, 단점 하나는 꼭 적습니다.">
<title>{{SITE_NAME}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#eef0ea; --paper-deep:#e3e6dd; --ink:#1c2430; --ink-soft:#55606c; --rule:#cfd4c9; --marker:#f6e75a; --marker-ink:#1c2430; --link:#1f4d7a; }
  @media (prefers-color-scheme: dark) { :root { --paper:#171a18; --paper-deep:#1f2320; --ink:#e8eae4; --ink-soft:#a3a99e; --rule:#343a35; --marker:#d9c93a; --marker-ink:#171a18; --link:#9cc3ea; } }
  * { box-sizing:border-box; }
  html { background:var(--paper); }
  body { margin:0; color:var(--ink); background:var(--paper); font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Pretendard",system-ui,sans-serif; font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  main { max-width:720px; margin:0 auto; padding:24px 16px 64px; }
  a { color:inherit; }
  .disclosure { font-size:12.5px; color:var(--ink-soft); line-height:1.5; margin:0 0 20px; }
  .disclosure p { margin:0; }
  .masthead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:8px; }
  .masthead h1 { font-family:"Gowun Batang",serif; font-weight:700; font-size:26px; margin:0; letter-spacing:-0.01em; }
  .masthead .who { margin:0; font-size:14px; color:var(--ink-soft); }
  .masthead .who a { text-decoration:none; border-bottom:1px solid var(--rule); }
  .tagline { font-family:"Gowun Batang",serif; font-size:16px; margin:6px 0 22px; padding-left:12px; border-left:3px solid var(--marker); color:var(--ink); }

  /* 오늘의 추천 */
  .hero { background:var(--paper-deep); border-radius:14px; padding:16px; margin-bottom:28px; }
  .hero .kicker { margin:0 0 10px; font-size:13px; font-weight:600; color:var(--ink-soft); }
  .hero-row { display:grid; grid-template-columns:150px 1fr; gap:16px; align-items:start; }
  .hero-img { width:150px; height:150px; object-fit:cover; border-radius:10px; display:block; background:var(--paper); }
  .hero .name { margin:0 0 6px; font-size:19px; line-height:1.35; font-weight:600; }
  .hero .name a { text-decoration:none; }
  .hero .name span { background:linear-gradient(transparent 55%, var(--marker) 55%, var(--marker) 92%, transparent 92%); padding:0 2px; }
  @media (prefers-color-scheme: dark) { .hero .name span { background:linear-gradient(transparent 60%, rgba(217,201,58,.42) 60%, rgba(217,201,58,.42) 92%, transparent 92%); } }
  .hero .price { margin:0 0 6px; font-weight:600; }
  .hero .price s { color:var(--ink-soft); font-weight:400; margin-left:6px; }
  .hero .reason { margin:0 0 8px; font-size:15px; }
  .hero .con { margin:0 0 12px; font-size:13.5px; color:var(--ink-soft); }
  .hero .con b { color:var(--ink); }
  .hero .go { display:block; text-align:center; font-weight:600; color:var(--marker-ink); background:var(--marker); border-radius:8px; padding:12px; text-decoration:none; }
  .hero .more { display:block; text-align:center; font-size:13.5px; color:var(--ink-soft); margin-top:8px; }
  @media (max-width:480px) { .hero-row { grid-template-columns:1fr; } .hero-img { width:100%; height:auto; aspect-ratio:1; } }

  /* 탭 */
  .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  .tab { font:inherit; font-size:14px; font-weight:500; color:var(--ink); background:transparent; border:1px solid var(--rule); border-radius:999px; padding:6px 12px; cursor:pointer; }
  .tab small { color:var(--ink-soft); font-size:12px; margin-left:2px; }
  .tab.is-on { background:var(--ink); color:var(--paper); border-color:var(--ink); }
  .tab.is-on small { color:var(--paper); opacity:.8; }
  .tab:focus-visible { outline:2px solid var(--link); outline-offset:2px; }

  /* 그리드 */
  .grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px 12px; }
  @media (max-width:560px) { .grid { grid-template-columns:repeat(2, 1fr); } }
  .card { display:block; text-decoration:none; }
  .card[hidden] { display:none; }
  .thumb { width:100%; aspect-ratio:1; object-fit:cover; border-radius:10px; display:block; background:var(--paper-deep); }
  .empty-thumb { display:grid; place-items:center; color:var(--ink-soft); font-size:12px; }
  .card .name { margin:8px 0 2px; font-size:14px; line-height:1.4; font-weight:500; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .card .price { margin:0 0 2px; font-size:14px; font-weight:600; }
  .card .meta { margin:0; font-size:12px; color:var(--ink-soft); }
  .badge { display:inline-block; border:1px solid var(--rule); border-radius:999px; padding:0 7px; font-size:11px; margin-right:4px; }
  .card:hover .thumb { filter:brightness(.97); }
  .card:focus-visible { outline:2px solid var(--link); outline-offset:3px; border-radius:6px; }
  .count { font-size:13px; color:var(--ink-soft); margin:0 0 10px; }
  .empty { padding:24px 0; color:var(--ink-soft); }

  footer { margin-top:44px; font-size:12.5px; color:var(--ink-soft); line-height:1.6; }
  footer p { margin:0 0 4px; }
</style>
{{ANALYTICS}}
</head>
<body>
<main>
  <div class="disclosure">
    <p>{{AI_LABEL}}</p>
    <p>{{AFFILIATE_LABEL}}</p>
  </div>

  <header>
    <div class="masthead">
      <h1>{{SITE_NAME}}</h1>
      <p class="who">하루 · 서울 원룸 · <a href="{{THREADS}}" rel="me">스레드</a> · <a href="{{INSTAGRAM}}" rel="me">인스타</a></p>
    </div>
    <p class="tagline">{{TAGLINE}}</p>
  </header>

{{HERO}}

  <nav class="tabs" aria-label="카테고리">
{{TABS}}
  </nav>
  <p class="count">지금까지 고른 것 {{COUNT}}개</p>
  <section class="grid" id="grid">
{{GRID}}
  </section>

  <footer>
    <p>마지막 갱신 {{GENERATED_AT}} (KST)</p>
    <p>링크를 누르면 판매처로 이동하고, 구매가 생기면 하루에게 수수료가 들어옵니다. 가격과 재고는 판매처 기준입니다.</p>
{{PROGRAM_NOTES}}
  </footer>
</main>
<script>
(function () {
  var tabs = document.querySelectorAll('.tab');
  var cards = document.querySelectorAll('.card');
  function show(cat) {
    cards.forEach(function (c) { c.hidden = !!cat && c.getAttribute('data-cat') !== cat; });
    tabs.forEach(function (t) { t.classList.toggle('is-on', t.getAttribute('data-cat') === cat); });
    try { history.replaceState(null, '', cat ? '#' + encodeURIComponent(cat) : location.pathname); } catch (e) {}
  }
  tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.getAttribute('data-cat')); }); });
  var h = decodeURIComponent(location.hash.slice(1));
  if (h) show(h);
})();
</script>
</body>
</html>
