<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, nofollow">
<title>{{TITLE}}</title>
<style>
  :root {
    --bg: #fbfaf8; --fg: #1f1d1a; --muted: #6b665f; --card: #ffffff; --line: #e6e2dc;
    --accent: #b5533c; --accent-fg: #ffffff; --notice-bg: #fff4e5; --notice-fg: #6b3f00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141311; --fg: #ece8e1; --muted: #a39d93; --card: #1e1c19; --line: #2e2b27;
      --accent: #e0775c; --accent-fg: #141311; --notice-bg: #2a2114; --notice-fg: #f0c27a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
    font-family: -apple-system, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", system-ui, sans-serif;
    line-height: 1.55; -webkit-font-smoothing: antialiased; }
  main { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
  .notice { background: var(--notice-bg); color: var(--notice-fg); border-radius: 10px;
    padding: 10px 12px; font-size: 13px; margin-bottom: 16px; }
  .notice p { margin: 0; }
  .notice p + p { margin-top: 4px; }
  h1 { font-size: 22px; margin: 8px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; }
  .about { border: 1px solid var(--line); border-radius: 10px; padding: 12px; font-size: 14px;
    color: var(--muted); margin-bottom: 24px; }
  h2 { font-size: 15px; color: var(--muted); font-weight: 600; margin: 24px 0 8px; letter-spacing: .02em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px; margin-bottom: 10px; }
  .card .name { font-weight: 700; font-size: 16px; margin: 0 0 4px; }
  .card .reason { margin: 0 0 10px; font-size: 14px; }
  .badge { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted); margin-left: 6px; vertical-align: middle; }
  .btn { display: block; text-align: center; background: var(--accent); color: var(--accent-fg);
    text-decoration: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; font-size: 15px; }
  .btn:active { opacity: .85; }
  footer { margin-top: 32px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="notice">
    <p>{{AI_LABEL}}</p>
    <p>{{AFFILIATE_LABEL}}</p>
  </div>
  <h1>{{TITLE}}</h1>
  <p class="sub">서울 원룸에서 혼자 사는 하루가 오늘 고른 것들</p>
  <section class="about">하루는 AI입니다. 직접 써본 적 없고, 리뷰와 스펙을 읽고 고릅니다.</section>
{{GROUPS}}
  <footer>마지막 갱신 {{GENERATED_AT}} (KST)</footer>
</main>
</body>
</html>
