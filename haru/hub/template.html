<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index, nofollow">
<meta name="description" content="AI 가상인물 하루가 리뷰를 읽고 고른 오늘의 추천. 써본 척 안 하고, 단점 하나는 꼭 적습니다.">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #eef0ea;
    --paper-deep: #e3e6dd;
    --ink: #1c2430;
    --ink-soft: #55606c;
    --rule: #cfd4c9;
    --marker: #f6e75a;
    --marker-ink: #1c2430;
    --link: #1f4d7a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #171a18;
      --paper-deep: #1f2320;
      --ink: #e8eae4;
      --ink-soft: #a3a99e;
      --rule: #343a35;
      --marker: #d9c93a;
      --marker-ink: #171a18;
      --link: #9cc3ea;
    }
  }
  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif;
    font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased;
  }
  main { max-width: 520px; margin: 0 auto; padding: 28px 20px 64px; }

  /* 고지: 숨기지 않되 조용하게. 맨 위 두 줄. */
  .disclosure { font-size: 13px; color: var(--ink-soft); line-height: 1.5; margin: 0 0 28px; }
  .disclosure p { margin: 0; }

  /* 머리: 이름 + 한 줄 */
  .masthead { margin-bottom: 36px; }
  .masthead h1 {
    font-family: "Gowun Batang", "Nanum Myeongjo", serif; font-weight: 700;
    font-size: 30px; line-height: 1.25; letter-spacing: -0.01em; margin: 0 0 10px;
  }
  .masthead .who { margin: 0; font-size: 15px; color: var(--ink-soft); }
  .masthead .who a { color: inherit; }
  .masthead .rule-line {
    font-family: "Gowun Batang", serif; font-size: 17px; line-height: 1.55;
    margin: 18px 0 0; padding-left: 14px; border-left: 3px solid var(--marker);
  }

  /* 날짜 묶음 */
  h2 {
    font-size: 14px; font-weight: 600; color: var(--ink-soft); margin: 32px 0 4px;
    display: flex; align-items: center; gap: 10px;
  }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }

  /* 항목: 사진 + 글 + 버튼. 항목 전체가 하나의 링크. */
  .pick { display: block; color: inherit; text-decoration: none; padding: 18px 0 20px;
    border-bottom: 1px solid var(--rule); }
  .pick:last-child { border-bottom: 0; }
  .pick .row { display: grid; grid-template-columns: 96px 1fr; gap: 14px; align-items: start; }
  .pick .thumb { width: 96px; height: 96px; border-radius: 6px; object-fit: cover;
    background: var(--paper-deep); display: block; }
  .pick .thumb.empty-thumb { display: grid; place-items: center; color: var(--ink-soft); font-size: 12px; }
  .pick .name { margin: 0 0 6px; font-size: 18px; font-weight: 600; line-height: 1.35; }
  .pick .name span {
    background: linear-gradient(transparent 55%, var(--marker) 55%, var(--marker) 92%, transparent 92%);
    color: var(--marker-ink); padding: 0 2px;
  }
  @media (prefers-color-scheme: dark) {
    .pick .name span { color: var(--ink); background: linear-gradient(transparent 60%, rgba(217,201,58,.45) 60%, rgba(217,201,58,.45) 92%, transparent 92%); }
  }
  .pick .price { margin: 0 0 6px; font-size: 15px; font-weight: 600; }
  .pick .price s { color: var(--ink-soft); font-weight: 400; margin-left: 6px; }
  .pick .reason { margin: 0 0 8px; font-size: 15px; }
  .pick .fact { margin: 0 0 4px; font-size: 13.5px; color: var(--ink-soft); }
  .pick .con { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
  .pick .con b { color: var(--ink); font-weight: 600; }
  .pick .go {
    display: block; margin-top: 12px; text-align: center; font-size: 15px; font-weight: 600;
    color: var(--ink); background: var(--marker); border-radius: 8px; padding: 12px 14px;
  }
  @media (prefers-color-scheme: dark) { .pick .go { color: var(--marker-ink); } }
  .pick:hover .go, .pick:focus-visible .go { filter: brightness(.96); }
  .pick:focus-visible { outline: 2px solid var(--link); outline-offset: 4px; border-radius: 4px; }
  @media (max-width: 380px) { .pick .row { grid-template-columns: 80px 1fr; } .pick .thumb { width: 80px; height: 80px; } }

  .empty { padding: 24px 0; color: var(--ink-soft); font-size: 15px; }

  footer { margin-top: 44px; font-size: 13px; color: var(--ink-soft); line-height: 1.6; }
  footer p { margin: 0 0 4px; }
  footer a { color: inherit; }
  @media (prefers-reduced-motion: no-preference) {
    .pick .go { transition: text-decoration-thickness .12s ease; }
  }
</style>
</head>
<body>
<main>
  <div class="disclosure">
    <p>{{AI_LABEL}}</p>
    <p>{{AFFILIATE_LABEL}}</p>
  </div>

  <header class="masthead">
    <h1>{{TITLE}}</h1>
    <p class="who">하루 · 서울 원룸 · <a href="https://www.threads.com/@haru.reviews" rel="me">@haru.reviews</a></p>
    <p class="rule-line">써본 척은 안 해요. 리뷰를 읽고 비교한 것만 적고, 단점 하나는 꼭 남깁니다.</p>
  </header>

{{GROUPS}}

  <footer>
    <p>마지막 갱신 {{GENERATED_AT}} (KST)</p>
    <p>링크를 누르면 판매처로 이동하고, 구매가 생기면 하루에게 수수료가 들어옵니다. 가격과 재고는 판매처 기준입니다.</p>
{{PROGRAM_NOTES}}
  </footer>
</main>
</body>
</html>
